workflows:
  android-release:
    name: Sixty Android Release
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      groups:
        # Codemagic -> Environment variables, group "sixty_android":
        #   GCLOUD_SERVICE_ACCOUNT_CREDENTIALS = contents of the Google Play service account JSON (secure)
        - sixty_android
      android_signing:
        # Name of the keystore uploaded in Codemagic -> Code signing identities -> Android
        - sixty_keystore
      node: 22
      java: 17
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web bundle and sync into Android project
        script: npm run sync
      - name: Build signed release bundle (.aab)
        script: |
          export BUILD_NUMBER=$(( ${PROJECT_BUILD_NUMBER:-1} + 100 ))
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: alpha   # closed testing. Change to production when ready.
        submit_as_draft: true
